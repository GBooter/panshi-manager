<?xml version="1.0" encoding="UTF-8"?>
<!--
  单色 outline 源图（2026-10-24 侧栏改线性图标风格）。
  ⚠️ 颜色契约：本文件只画形状（纯黑），运行时由 sidebar.cpp 的
     delegate 按语义染色（选中=Accent，常规=Normal 正文色）。
     往本文件里加彩色会让染色后仍残留固定色相 —— 不要加。
-->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">

  <g fill="none" stroke="#000000" stroke-width="9"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="36" width="100" height="58" rx="10"/>
    <circle cx="64" cy="65" r="14"/>
  </g>
  <circle cx="64" cy="65" r="4.5" fill="#000000"/>
</svg>
